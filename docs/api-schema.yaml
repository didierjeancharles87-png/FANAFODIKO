          description: ''
    patch:
      operationId: api_v1_accounts_patient_addresses_partial_update
      summary: Modifier une adresse de retrait
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Patients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBuyerAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBuyerAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBuyerAddressRequest'
