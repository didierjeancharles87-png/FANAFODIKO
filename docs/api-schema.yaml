          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerAddress'
          description: ''
    delete:
      operationId: api_v1_accounts_patient_addresses_destroy
      summary: Supprimer logiquement une adresse de retrait
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Patients
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
