      - Patients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BuyerAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BuyerAddressRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
