components:
  schemas:
    AccountList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Adresse électronique
          maxLength: 254
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        is_active:
          type: boolean
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        is_staff:
          type: boolean
          title: Statut équipe
          description: Précise si l’utilisateur peut se connecter à ce site d'administration.
        status:
          type: string
        roles:
          type: array
          items:
            type: string
            title: Nom
          readOnly: true
        date_joined:
          type: string
          format: date-time
          title: Date d’inscription
      required:
      - id
      - roles
      - status
      - username
    AdminDashboard:
      type: object
      properties:
        users:
          $ref: '#/components/schemas/AdminUserMetrics'
        professional_verifications:
          $ref: '#/components/schemas/AdminVerificationMetrics'
      required:
      - professional_verifications
      - users
    AdminProfessionalDocument:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        document_type:
          allOf:
          - $ref: '#/components/schemas/DocumentTypeEnum'
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        review_status:
          allOf:
          - $ref: '#/components/schemas/ProfessionalDocumentReviewStatusEnum'
          readOnly: true
        download_url:
          type: string
          format: uri
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        profile_id:
          type: integer
          readOnly: true
        profile_name:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
      required:
      - category
      - content_type
      - created_at
      - document_type
      - download_url
      - id
      - original_filename
      - profile_id
      - profile_name
      - review_status
      - size_bytes
    AdminProfessionalProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/ProfessionalCategoryEnum'
          readOnly: true
        category_label:
          type: string
          readOnly: true
        legal_name:
          type: string
          maxLength: 180
        manager_name:
          type: string
          maxLength: 180
        contact_phone:
          type: string
          pattern: ^\+?[0-9 ()-]{6,20}$
          maxLength: 20
        contact_email:
          type: string
          format: email
          maxLength: 254
        country:
          type: integer
          nullable: true
        region:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        address:
          type: string
          maxLength: 240
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        description:
          type: string
          maxLength: 4000
        details: {}
        account_status:
          type: string
          readOnly: true
        verification_status:
          allOf:
          - $ref: '#/components/schemas/ProfessionalProfileVerificationStatusEnum'
          readOnly: true
        is_complete:
          type: boolean
          readOnly: true
        missing_information:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
      required:
      - account_status
      - category
      - category_label
      - created_at
      - id
      - is_complete
      - legal_name
      - missing_information
      - updated_at
      - user_email
      - user_id
      - verification_status
    AdminUserMetrics:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        suspended:
          type: integer
        closed:
          type: integer
        disabled:
          type: integer
      required:
      - active
      - closed
      - disabled
      - suspended
      - total
    AdminVerificationMetrics:
      type: object
      properties:
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
      required:
      - approved
      - pending
      - rejected
    AuthSession:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        account_status:
          type: string
        roles:
          type: array
          items:
            type: string
          readOnly: true
        professional_profile_id:
          type: integer
          nullable: true
          readOnly: true
      required:
      - account_status
      - email
      - id
      - professional_profile_id
      - roles
    BlankEnum:
      enum:
      - ''
    BuyerAddress:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 60
        recipient_name:
          type: string
          maxLength: 120
        phone_number:
          type: string
          pattern: ^\+?[0-9 ()-]{6,20}$
          maxLength: 20
        country:
          type: integer
        region:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        neighbourhood:
          type: string
          maxLength: 120
        complement:
          type: string
          maxLength: 500
        is_primary:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - country
      - created_at
      - id
      - phone_number
      - recipient_name
      - updated_at
    BuyerAddressRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 60
        recipient_name:
          type: string
          minLength: 1
          maxLength: 120
        phone_number:
