              schema:
                $ref: '#/components/schemas/BuyerAddress'
          description: ''
  /api/v1/accounts/patient/addresses/{id}/:
    get:
      operationId: api_v1_accounts_patient_addresses_retrieve
      summary: Consulter une adresse de retrait
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Patients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
